<div class="sidebar">
  <div class="container sidebar-sticky">

    <div class="sidebar-about">

      <img src="{{ site.baseurl }}/public/profile.jpg"
           alt="Samanvitha"
           class="profile-picture">

	<div class="social-icons">

  	<a href="YOUR_ORCID_URL"
     	   target="_blank"
     	   rel="noopener noreferrer"
     	   aria-label="ORCID">
    	   <i class="fa-brands fa-orcid"></i>
  	</a>

  	<a href="YOUR_GOOGLE_SCHOLAR_URL"
     	   target="_blank"
     	   rel="noopener noreferrer"
     	   aria-label="Google Scholar">
    	   <i class="fa-solid fa-graduation-cap"></i>
  	</a>

  	<a href="https://github.com/Samanvithavs"
     	   target="_blank"
     	   rel="noopener noreferrer"
           aria-label="GitHub">
           <i class="fa-brands fa-github"></i>
        </a>

  	<a href="YOUR_RESEARCHGATE_URL"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="ResearchGate">
           <i class="fa-brands fa-researchgate"></i>
        </a>

	</div>



      <h1>
        <a href="{{ site.baseurl }}">
          {{ site.title }}
        </a>
      </h1>

    </div>

    <nav class="sidebar-nav">

      <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}"
         href="{{ site.baseurl }}/">
        Home
      </a>

      {% assign pages_list = site.pages %}

      {% for node in pages_list %}
        {% if node.title != null %}
          {% if node.layout == "page" %}

            <a class="sidebar-nav-item{% if page.url == node.url %} active{% endif %}"
               href="{{ site.baseurl }}{{ node.url }}">
              {{ node.title }}
            </a>

          {% endif %}
        {% endif %}
      {% endfor %}

      <a class="sidebar-nav-item"
         href="https://github.com/Samanvithavs">
        GitHub
      </a>

    </nav>

    <p>
      &copy; {{ site.time | date: '%Y' }} Samanvitha.
    </p>

  </div>
</div>
